name: Mercos — vincular carteira em lote

# Vincula uma LISTA de CNPJs a carteira de um vendedor no Mercos, ES e/ou RJ.
# Criado 11/set/2026 para a rede Bel Cosmeticos (75 lojas -> Fernanda Vidal).
#
# NAO e o pipeline de pos-cadastro (`cadastro-rca-mercos.yml`). Aquele e movido
# pelo LEDGER e so alcanca cliente que passou pela planilha de cadastro novo;
# `--cnpjs` la FILTRA linhas existentes, nao cria. Este aqui recebe a lista
# direto e faz SO a etapa de carteira -- nao toca tabela de preco, condicao de
# pagamento, planilha, ledger nem WhatsApp.
#
# O botao usado no Mercos e `habilitar_`: ADICIONA o cliente a carteira do
# vendedor, NAO remove de ninguem. Vincular um segundo RCA nao tira o primeiro.
#
# ⚠️ Mercos so aceita 1 SESSAO por usuario. Se alguem logar na mesma conta no
# meio da rodada, a sessao cai e o resto falha em cascata (incidente 18/ago/2026).
# Rodar fora do expediente.

on:
  workflow_dispatch:
    inputs:
      vendedor:
        description: 'Nome do vendedor COMO O MERCOS ESCREVE (ex.: Fernanda Vidal). Substring: nome mais curto casa, mais longo nao.'
        required: true
      filial:
        description: "Em qual filial vincular"
        required: true
        type: choice
        options: [ "rj", "es", "ambas" ]
        default: "ambas"
      cnpjs_arquivo:
        description: "Arquivo com 1 CNPJ por linha (em automacoes/cadastro-rca-mercos/)"
        required: false
        default: "cnpjs_bel.txt"
      cnpjs:
        description: "CNPJs avulsos separados por virgula (somam-se ao arquivo)"
        required: false
        default: ""
      dry_run:
        description: "Só confere que o nome do vendedor acha 1 card, sem habilitar nada"
        required: false
        type: boolean
        default: true

jobs:
  vincular:
    runs-on: ubuntu-latest
    # Duas filiais em sequencia, cada uma com login proprio. 75 CNPJs levam
    # ~10-15 min por filial; 60 cobre as duas com folga para o 2FA.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automacoes/cadastro-rca-mercos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ⚠️ RJ e ES sao invocacoes SEPARADAS, nunca o mesmo processo: o passo da
      # carteira le os usuarios da empresa em que a SESSAO esta logada, entao
      # misturar poria a carteira na empresa errada SEM ERRO NENHUM.
      - name: Vincular carteira
        env:
          MERCOS_EMAIL: ${{ secrets.MERCOS_EMAIL }}
          MERCOS_SENHA: ${{ secrets.MERCOS_SENHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--vendedor "${{ inputs.vendedor }}")
          if [ -n "${{ inputs.cnpjs_arquivo }}" ]; then
            ARGS+=(--cnpjs-arquivo "${{ inputs.cnpjs_arquivo }}")
          fi
          if [ -n "${{ inputs.cnpjs }}" ]; then
            ARGS+=(--cnpjs "${{ inputs.cnpjs }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          case "${{ inputs.filial }}" in
            ambas) FILIAIS="rj es" ;;
            *)     FILIAIS="${{ inputs.filial }}" ;;
          esac

          for F in $FILIAIS; do
            echo "::group::filial $F"
            python vincular_carteira_lote.py --filial "$F" "${ARGS[@]}"
            echo "::endgroup::"
          done
