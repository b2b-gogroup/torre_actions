name: CadastroRCA-Mercos — varredura (2ª fonte do portão)

# Pergunta ao Mercos "este CNPJ existe aí?" para a fila em `aguardando_mercos`,
# grava o que ACHOU em `mercos_cliente_confirmado` e roda o decisor pra
# reclassificar. Não escreve nada no Mercos -- é leitura.
#
# ⚠️ POR QUE EXISTE: o portão do decisor confirma pelo log do middleware
# Protheus->Mercos, e esse middleware está PARADO desde 09/set/2026 -- nenhum
# cadastro novo propaga, e todo cliente fica em `aguardando_mercos` para
# sempre. A 2ª fonte (esta varredura) era rodada À MÃO, com a lista de CNPJs
# digitada e o resultado carregado no banco na mão: 14 cargas manuais entre
# 11 e 23/set. Aqui a lista sai do próprio ledger.
#
# ⚠️ Este workflow é o FALLBACK. O caminho preferido é LOCAL, pelo runbook
# `docs/processos/mercos-operacao-local.md` + `ferramentas/_env.py`: não gasta
# minuto de Actions e ainda é mais rápido, porque local o IP é confiado e o
# Mercos não pede 2FA (no Actions são ~50 s por login, 2 logins por varredura).
# A nota antiga aqui dizia que o Playwright não atravessava o firewall (4
# tentativas em 24/set morreram em 3 pontos do login) -- era rede intermitente:
# em 25/set a varredura completa rodou local sem queda, enquanto 2 das 3
# rodadas do Actions no mesmo dia perderam a sessão no meio.
#
# ⚠️ Sem `schedule` de propósito: o Mercos aceita UMA sessão por usuário e a
# conta é de uma pessoa -- rodar sozinho em horário comercial derruba quem
# estiver usando. Quem dispara escolhe a hora.

on:
  workflow_dispatch:
    inputs:
      cnpjs:
        description: "CNPJs extras separados por vírgula (opcional -- a fila do ledger já entra sozinha)"
        required: false
        default: ""
      decisor:
        description: "Rodar o decisor depois de carregar (reclassifica quem destravou)"
        type: boolean
        default: true

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automacoes/cadastro-rca-mercos
    steps:
      - uses: actions/checkout@v4

      - name: Cadastro de usuarios do Mercos (vem de secret, nunca do repo)
        # Repo publico: usuarios_mercos.csv tem 75 nomes e e-mails corporativos, que
        # viram lista de phishing direcionado. Escrito aqui a partir do secret, usado
        # pelo run, morto com o runner. Passa por env e nao interpolado no shell, para
        # o conteudo nunca ser reinterpretado como comando.
        env:
          CSV: ${{ secrets.USUARIOS_MERCOS_CSV }}
        run: printf '%s' "$CSV" > automacoes/cadastro-rca-mercos/usuarios_mercos.csv



      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Alvos (fila do ledger + CNPJs informados)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ferramentas/alvos_varredura.py alvos.txt "${{ inputs.cnpjs }}"

      - name: Varredura no Mercos (ES + RJ, somente leitura)
        env:
          MERCOS_EMAIL: ${{ secrets.MERCOS_EMAIL }}
          MERCOS_SENHA: ${{ secrets.MERCOS_SENHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
        run: python ferramentas/varredura_mercos.py alvos.txt varredura.json

      - name: Carregar o que achou em mercos_cliente_confirmado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ferramentas/carregar_confirmados.py varredura.json

      # Reclassifica: quem a varredura achou sai de `aguardando_mercos` e vira
      # `pendente` (com filial), que é o que o escritor consegue enxergar --
      # o escritor filtra por `mercos_empresa_id`, e linha aguardando tem filial vazia.
      - name: Decisor (reclassifica o ledger -- não toca no Mercos)
        if: ${{ inputs.decisor }}
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CADASTRO_RCA_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.CADASTRO_RCA_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python decisor.py
