name: CreditoLimite-Mercos — varredura do espelho (só leitura)

# O QUE FAZ: lê o limite disponível dos clientes no Mercos e grava o retrato em
# `credito_limite_mercos`. **Nunca escreve no Mercos** — nem com `--aplicar` por
# engano na linha de comando (o robô derruba o `--aplicar` neste modo).
#
# POR QUE EXISTE, separado do workflow que repõe: pedido do dono da Torre em
# 21/ago/2026 — "um bot que vai sobreviver muito tempo e vai, o mais rápido
# quanto for saudável, varrer todos pra pegar o disponível". São ~800 clientes (os
# que aparecem na tela de crédito), a ~6 s cada = ~80 minutos de trabalho real,
# que não cabe numa execução de 30 min do Actions.
#
# ⚠️ ELE SE ESGOTA SOZINHO, e isso é o ponto. `--frescor-dias 7` faz a rodada
# pular quem já foi lido na última semana; quando a fila esvazia, cada execução
# sai em segundos sem nem abrir o navegador. Sem esse corte, ele releria a mesma
# base para sempre — gastando minutos do Actions e a sessão do Mercos à noite
# inteira, todas as noites.
#
# ⚠️ POR QUE DE MADRUGADA: o Mercos aceita **uma sessão por usuário**. Rodar no
# horário comercial derruba quem estiver usando a conta. A varredura roda às
# 03h00 BRT e termina antes da reposição das 05h00.
#
# ⚠️ POR QUE `concurrency` COMPARTILHADO com o workflow de reposição: os dois usam
# a mesma sessão do Mercos. Duas execuções ao mesmo tempo derrubariam uma à outra
# — e a que perdesse ficaria com a leitura pela metade.

on:
  schedule:
    # 06h00 UTC = 03h00 BRT. Uma execução de até 200 clientes (≈20 min) deixa
    # ampla folga antes do robô de reposição das 05h00. O Actions pode atrasar
    # schedules sob carga; a concurrency compartilhada continua impedindo que
    # ele use a sessão do Mercos ao mesmo tempo que a reposição.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos clientes ler nesta rodada (200 ≈ 20 min)"
        required: false
        default: "200"
      universo:
        description: "credito = os ~800 da tela de crédito · todos = a base inteira"
        required: false
        default: "credito"
        type: choice
        options:
          - credito
          - todos
      frescor:
        description: "Pula quem foi lido nos últimos N dias (0 = relê todos)"
        required: false
        default: "7"

# A MESMA trava do workflow de reposição, de propósito: sessão única no Mercos.
concurrency:
  group: credito-limite-mercos
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    # ⚠️ O CRON SÓ VALE NO REPO CANÔNICO. `schedule` dispara em TODO espelho do
    # rodízio que tenha este arquivo, e o `concurrency` do Actions é POR
    # REPOSITÓRIO — não serializa entre contas. Medido em 26/ago/2026: o espelho
    # `italo-mgl/torre_etl` rodava os dois crons de crédito, e as varreduras de lá
    # derrubavam a sessão das daqui (o Mercos aceita 1 sessão por usuário, e mesmo
    # a varredura, que só LÊ, ocupa essa sessão). A trava do banco protege o
    # dinheiro, não a sessão — daí esta guarda.
    #
    # ⚠️ SÓ BARRA O `schedule`. `workflow_dispatch` continua valendo em qualquer
    # repo: rodada manual é decisão de uma pessoa, que sabe o que está fazendo.
    #
    # ⚠️ A GUARDA É POR VARIÁVEL, NÃO PELO NOME DO REPO (28/ago/2026). Até aqui ela
    # dizia `github.repository == <repo canonico>`, o que amarrava o robô a UMA
    # conta — e o ETL da Torre roda em RODÍZIO de 3 espelhos, porque a cota grátis
    # de Actions esgota em ~19 dias. Na virada de 27/ago isso apareceu: mover o ETL
    # para `italo-mgl` deixaria o crédito preso na conta que estava saindo, e
    # sincronizar o arquivo para lá faria o `schedule` ser PULADO nos dois lugares —
    # robô parado sem erro em lugar nenhum. Com a variável, virar o rodízio é
    # `gh variable set RODIZIO_ATIVO -b true -R <espelho novo>` + `delete` no antigo.
    #
    # ⚠️ FALHA FECHANDO, de propósito: espelho SEM a variável não roda no schedule.
    # Isso é o oposto do desenho antigo, em que espelho que não tivesse sincronizado
    # o arquivo rodava SOLTO — foi assim que o cron de `italo-mgl` disparou em
    # 25-27/ago e roubou a sessão do Mercos (que aceita 1 sessão por usuário).
    # O preço é que esquecer de setar a variável PARA o robô: o detector disso é a
    # pílula da Gestão de Crédito, que fica vermelha quando não há rodada há 36h.
    #
    # `workflow_dispatch` continua livre em qualquer espelho: rodada manual é decisão
    # de uma pessoa, que sabe o que está fazendo.
    if: github.event_name != 'schedule' || vars.MERCOS_ATIVO == 'true'
    # ⚠️ 60 min por causa da ESPERA DE 15 MIN de `ESPERA_VOLTA_S` (repositor.py):
    # quando a sessão do Mercos cai — que é exatamente o que derrubou a varredura
    # de 26/ago/2026 — o robô dorme 15 min antes de voltar, até 2x. Com 28 min o
    # Actions o mataria DORMINDO, sem log nem aviso. `CREDITO_JANELA_MIN` (55) é
    # quem faz ele desistir da volta que não cabe, com e-mail, antes disso.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automacoes/credito-limite-mercos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Varredura
        env:
          MERCOS_EMAIL: ${{ secrets.MERCOS_EMAIL }}
          MERCOS_SENHA: ${{ secrets.MERCOS_SENHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role obrigatório: as tabelas e a view têm RLS.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MERCOS_EMPRESAS: ${{ vars.MERCOS_EMPRESAS }}
          AVISO_PARA: ${{ vars.AVISO_PARA }}
          DISPARADO_POR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # ⚠️ SEMPRE ABAIXO do `timeout-minutes` do job (60) — ver o comentário lá.
          CREDITO_JANELA_MIN: "55"
          # ⚠️ ZERO VOLTAS **AQUI**, e só aqui: quando a sessão cai, esta varredura
          # aborta na hora em vez de dormir 15 min para tentar reentrar. A escolha
          # é do tipo de trabalho, não uma discordância com o `ESPERA_VOLTA_S` do
          # `repositor.py` — a reposição segue com as 2 voltas de 15 min, porque lá
          # perder a rodada é dinheiro parado e a trava do banco só deixa UMA por
          # dia. Aqui é **só leitura**, nada se perde e a próxima janela é logo:
          # dormir 15 min de runner para talvez ser derrubado de novo pela mesma
          # pessoa é pagar por nada. E quem derruba o robô é gente usando o Mercos
          # (1 sessão por usuário) — reentrar em seguida a expulsaria de volta.
          # ⚠️ O efeito prático é o teto de tempo: com isto, o pior caso da
          # varredura é "abortou em 5 min", nunca a hora inteira de 22/set/2026.
          CREDITO_VOLTAS_SESSAO: "0"
        run: |
          # 200 e nao 250: a ~6 s por cliente sao ~20 min, com 8 min de folga para
          # o teto de 28. Em 250 a rodada encosta no limite e morre no meio -- o
          # espelho nao perde nada (cada cliente e gravado na hora), mas a linha da
          # auditoria fica aberta e alguem vai investigar um falso travamento.
          # ⚠️ `${{ inputs.X }}` chega VAZIO quando o gatilho é o `schedule` (não há
          # inputs num cron), então o default do YAML não vale aqui — o default de
          # verdade é este abaixo. `if` em vez de `&&` por legibilidade e para não
          # depender da posição da linha no script.
          LIM="${{ inputs.limite }}";   if [ -z "$LIM" ]; then LIM=200; fi
          UNI="${{ inputs.universo }}"; if [ -z "$UNI" ]; then UNI=credito; fi
          FRE="${{ inputs.frescor }}";  if [ -z "$FRE" ]; then FRE=7; fi
          echo "varredura: limite=$LIM universo=$UNI frescor=${FRE}d"
          mkdir -p logs
          set -o pipefail
          PYTHONUNBUFFERED=1 python repositor.py --varredura \
            --limite "$LIM" --universo "$UNI" --frescor-dias "$FRE" \
            2>&1 | tee "logs/varredura-${{ github.run_id }}-${{ github.run_attempt }}.log"

      - name: Resumo
        if: always()
        run: |
          LOG=$(ls -t logs/varredura-*.log 2>/dev/null | head -1)
          {
            echo "## Varredura do espelho"
            echo ""
            if [ -n "$LOG" ]; then
              echo '```'
              grep -E "\[varredura\]|=== varredura|Nada para varrer" "$LOG" | tail -25
              echo '```'
            else
              echo "⚠️ Nenhum log — o robô morreu antes de escrever."
            fi
            echo ""
            echo "Cobertura depois desta rodada:"
            echo '```sql'
            echo "SELECT count(*) lidos, count(*) FILTER (WHERE nao_encontrado) ausentes,"
            echo "       count(*) FILTER (WHERE total > 0) com_teto, min(lido_em), max(lido_em)"
            echo "  FROM credito_limite_mercos;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
