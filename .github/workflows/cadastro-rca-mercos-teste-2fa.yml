name: CadastroRCA-Mercos — teste login 2FA

# Teste isolado (nao e a automacao real ainda): so confirma se o Mercos pede
# 2FA por e-mail quando logado a partir de uma maquina nova (runner do
# Actions, sem sessao/cookie previo) -- decide se precisamos de
# GMAIL_USER/GMAIL_SENHA como secret tambem antes de montar o workflow real.
# Ver torre_de_performance_b2b/CadastroRCA-Mercos/decisoes-e-plano.md

on:
  workflow_dispatch:

jobs:
  teste-2fa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacoes/cadastro-rca-mercos
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Testar login
        env:
          MERCOS_EMAIL: ${{ secrets.MERCOS_EMAIL }}
          MERCOS_SENHA: ${{ secrets.MERCOS_SENHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
        run: python teste_login_2fa.py
