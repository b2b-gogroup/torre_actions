name: CadastroRCA-Mercos — atualizar (só decisor, sem tocar no Mercos)

# Roda só o decisor.py: relê planilha + Metabase, revalida quem já confirmou
# no Mercos, atualiza o ledger. NAO abre o Mercos, NAO escreve nada (nem
# planilha, nem Mercos) -- é o "🔄 Atualizar" da Torre, rápido, sem 2FA.
# Ver CadastroRCA-Mercos/arquitetura-producao.md.

on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacoes/cadastro-rca-mercos
    steps:
      - uses: actions/checkout@v4

      - name: Cadastro de usuarios do Mercos (vem de secret, nunca do repo)
        # Repo publico: usuarios_mercos.csv tem 75 nomes e e-mails corporativos, que
        # viram lista de phishing direcionado. Escrito aqui a partir do secret, usado
        # pelo run, morto com o runner. Passa por env e nao interpolado no shell, para
        # o conteudo nunca ser reinterpretado como comando.
        env:
          CSV: ${{ secrets.USUARIOS_MERCOS_CSV }}
        run: printf '%s' "$CSV" > automacoes/cadastro-rca-mercos/usuarios_mercos.csv



      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (sem o browser do Playwright -- decisor nao usa)
        run: pip install -r requirements.txt

      - name: Decisor (le planilha + Metabase, revalida, atualiza ledger)
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CADASTRO_RCA_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.CADASTRO_RCA_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python decisor.py
