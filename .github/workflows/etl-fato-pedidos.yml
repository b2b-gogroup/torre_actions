name: ETL fato_pedidos (intraday skip)

# Run intraday LEVE:
#  • ETL_SKIP_NF_CARREGADAS — detalha só NFs novas (faturamento/desconto corretos)
#  • ETL_ABERTOS_DIAS=7     — pedidos abertos só dos últimos 7 dias (funil recente vivo),
#                             em vez dos 30d do full. Load deleta abertos só nessa janela.
# ~10min/run. Seguro: delete-by-nf_numero (faturadas) + delete de abertos casado à janela 7d.
# Ver docs/etl-fato-pedidos.md §6.
on:
  workflow_dispatch:
  schedule:
    # 8x/dia. ETL é rápido (~6-14min). Alvos (BRT): 08:00 · 09:30 · 10:30 · 12:00 ·
    # 13:00 · 14:30 · 15:00 · 16:00. Convertido p/ UTC (BRT+3).
    # ⚠️ GitHub Actions (free) é best-effort: o início REAL pode atrasar ~1-3h do
    # agendado e é imprevisível — não há como garantir pontualidade exata via cron.
    # Pontualidade só com gatilho externo (pg_cron / cron-job.org → workflow_dispatch).
    - cron: '0 11,15,16,18,19 * * *'   # UTC → BRT 08:00, 12:00, 13:00, 15:00, 16:00
    - cron: '30 12,13,17 * * *'        # UTC → BRT 09:30, 10:30, 14:30

concurrency:
  group: etl-fato-pedidos      # mesmo grupo do full — não rodam juntos
  cancel-in-progress: false

jobs:
  etl:
    # Rodizio de contas: este workflow existe em mais de um espelho (o push vai pra todos) e o
    # `schedule` dispara em TODOS. Sem a guarda, ele roda em conta que nao e a ativa -- em
    # 31/ago/2026 o ETL falhava 4x/dia em b2b-gogroup (job morto em 4s, 0 steps: billing
    # bloqueado) enquanto rodava certo em italo-mgl. Falha diaria esperada e o que faz ninguem
    # olhar quando a falha vira real.
    #
    # Virar o rodizio nao mexe em codigo: `gh variable set RODIZIO_ATIVO -b true -R <novo>` e
    # `gh variable delete RODIZIO_ATIVO -R <antigo>`.
    #
    # ⚠️ Falha FECHANDO: espelho sem a variavel nao roda no schedule. O preco e que esquecer de
    # setar a variavel PARA a carga -- o detector disso e `v_carga_atrasada` no banco.
    # `workflow_dispatch` continua livre em qualquer espelho: rodada manual e decisao de uma pessoa.
    # Variavel PROPRIA deste repo. RODIZIO_ATIVO nao serve: ela e compartilhada com os
    # robos do Mercos, e liga-la aqui teria significado ambiguo.
    # PERIGO DE DOBRA: concurrency e POR REPO. Se o repo antigo tambem estiver com a
    # guarda ligada, o ETL roda duas vezes no MESMO banco. Ligar aqui so depois de
    # desligar la.
    if: github.event_name != 'schedule' || vars.ETL_FATO_PEDIDOS_ATIVO == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: etl/package-lock.json

      - name: Install ETL dependencies
        working-directory: etl
        run: npm ci

      - name: Run ETL fato_pedidos (SKIP — detalha só NFs novas)
        working-directory: etl
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          TINY_TOKEN_ES: ${{ secrets.TINY_TOKEN_ES }}
          TINY_TOKEN_RJ: ${{ secrets.TINY_TOKEN_RJ }}
          TINY_API_INICIO: ${{ secrets.TINY_API_INICIO }}
          # Pula o detalhe (caro) de NF já carregada. Seguro (delete-by-nf_numero em modo skip).
          ETL_SKIP_NF_CARREGADAS: "true"
          # Pedidos abertos: janela de 7 dias no intraday (full usa 30). Mantém o funil
          # dos pedidos recentes vivo durante o dia, sem o custo dos 30d. Load deleta abertos
          # só nessa janela (não toca nos 8-90d do full). Antigos = run full da manhã.
          ETL_ABERTOS_DIAS: "7"
          # diff-delete anti-bloat (PADRÃO, validado 26/jul) — mesma janela 60d do intraday,
          # apaga só o que sumiu na origem em vez de delete-tudo+reinsere → não gera bloat.
          ETL_DIFF_DELETE: "true"
          # Janela do Protheus (extract + DELETE usam este MESMO valor, ver janela-protheus.ts).
          # O card 18516 sem filtro é ~39,9k linhas / ~5min e o transporte na frente do
          # Metabase corta em ~300s (3 tentativas falharam em 28/jul). Medido:
          #   60d → 14,3k linhas / ~190s  ← escolhido (mesma janela que o DELETE já usava)
          #   90d → 22,1k linhas / ~266s  (só 34s de margem até o corte — não recomendado)
          # Aumentar reflete deleção/retroativo antigo mais rápido, mas aproxima do timeout;
          # o que fica fora da janela é corrigido pelo full da manhã (sem janela).
          ETL_PROTHEUS_DIAS: "60"
        run: npx tsx fato-pedidos/index.ts
