name: CreditoLimite-Mercos — disponível e teto

# DOIS trabalhos, no mesmo robô e no mesmo run:
#
#  1. REPÔR O DISPONÍVEL (peça 3 de docs/kaique/03-robo-do-mercos.md) — lê a fila
#     de recibos (`credito_evento_pagamento`, processado = false) e devolve ao
#     "limite disponível" do Mercos o valor de cada boleto pago que o Mercos nunca
#     somou de volta, porque ele não sabe de pagamento em boleto.
#
#  2. ESCREVER O TETO (novo, 25/ago/2026) — lê as liberações assinadas no botão
#     "Liberar" da Gestão de Crédito (`credito_liberacao`) e escreve o "limite
#     total" no Mercos; e DESFAZ as que expiraram ou foram revogadas.
#
# ⚠️ A FRASE QUE ESTAVA AQUI ("NÃO MEXE NO LIMITE TOTAL") DEIXOU DE SER VERDADE, e
# a decisão que ela citava mudou de forma, não de conteúdo. O que continua valendo:
# **nenhum robô CALCULA o teto**. O número vem de `credito_liberacao.limite_para`,
# digitado e assinado por uma pessoa na tela, com motivo e trilha de auditoria —
# é o mesmo ato que alguém fazia à mão no Mercos, sem a mão.
# `POLITICA_HOMOLOGADA` segue `false` em `lib/credito/motor.ts`, e o robô nunca lê
# `motor_limite_sugerido`.
#
# ⚠️ O TETO ESCREVE OS **DOIS** CAMPOS, e isso foi MEDIDO (25/ago/2026, tela real,
# cliente Kassio Perfumaria): subir o `limiteTotal` de 30.000 para 40.000 deixou o
# `limiteDisponivel` parado em 22.554,18. Quem trava a venda é o disponível — um
# robô que escrevesse só o teto entregaria um botão "Liberar" que não libera nada,
# e ninguém descobriria pela tela, só pelo cliente continuar bloqueado.
#
# ⚠️ A ORDEM DOS DOIS STEPS É ESCOLHIDA: o teto vai ANTES da reposição. A reposição
# limita o disponível ao teto (`min(disp + pago, total)`) — rodar antes grudaria a
# conta no teto velho, e o crédito recém-liberado se perderia na mesma rodada.
#
# ⚠️ AGORA TEM CRON — 05h00 BRT, todo dia. A reposição roda depois da
# varredura noturna das 03h, fora do horário comercial, quando a sessão única
# do Mercos não disputa com a operação humana.
# reverte a decisão anterior ("nada sobe sozinho na primeira versão"), que valeu
# de 20 a 24/ago. O que mudou nesses 4 dias: o robô escreveu 4 vezes de verdade e
# o LOTE rodou (24/ago, 20 boletos → 15 repostos, R$ 32.184,17, 0 erros, 246 s).
# A aba "Ajuste de Crédito", que era o lugar onde uma pessoa apertava o play, saiu
# junto — não existe mais aprovação humana por rodada.
#
# ⚠️ POR QUE 05h E NÃO 13h. A cadeia é: extrato do Itaú grava 12h BRT → pg_cron
# `credito-evento-pagamento-sync` enche a fila 12h30 BRT. O ideal comercial seria
# 13h (crédito de volta no mesmo dia à tarde), e ele está BLOQUEADO por um
# pré-requisito que não é código: o Mercos aceita UMA sessão por usuário e o robô
# usa a conta compartilhada (`salesops@`) — rodar em horário comercial derruba
# quem estiver usando. Às 05h o robô fica fora do expediente e após a varredura
# das 03h. Criado o usuário exclusivo do robô, mover para `30 16 * * *` é uma
# linha para voltar a repor crédito no mesmo dia, durante o horário comercial.
#
# ⚠️ DUAS COISAS QUE O `schedule` FAZ DIFERENTE DO BOTÃO, e as duas já custaram
# rodada neste repositório:
#   1. `${{ inputs.X }}` chega VAZIO (não há inputs num cron), então o `default:`
#      do YAML NÃO vale — o default real é o do shell, abaixo. Sem isso o cron
#      rodaria com `modo` vazio, que não casa com nenhum `case` e viraria dry-run
#      silencioso: o log fica verde e nada é reposto.
#   2. `schedule` só existe na DEFAULT BRANCH e dispara em TODO espelho do rodízio
#      que tenha o workflow ativo. O `concurrency` abaixo é POR REPOSITÓRIO, então
#      ele não serializa entre contas. A trava contra rodada dobrada é no BANCO
#      (índice único `ux_credito_reposicao_cron_dia`, migration 20260824e): o 2º
#      INSERT do dia falha e o robô sai com 0.
#
# ⚠️ O padrão do `modo` NO BOTÃO continua `dry-run`: quem clica sem escolher nada
# não escreve. No CRON o padrão é `aplicar` — são defaults diferentes de propósito,
# porque um cron em dry-run não faz nada e ninguém perceberia.
#
# ── AUDITORIA (pedido do Kaique, 20/ago/2026) ────────────────────────────────
# Toda rodada grava no banco, em `credito_reposicao_rodada` + `credito_reposicao_log`:
# a data, A PESSOA que disparou (github.actor), e o valor ANTES e DEPOIS de cada
# cliente tocado. Depois da execução, conferir com:
#
#   SELECT * FROM v_credito_reposicao_auditoria ORDER BY quando DESC LIMIT 50;
#   SELECT * FROM v_credito_reposicao_violou_teto;   -- tem que voltar 0 linhas
#   SELECT * FROM v_credito_reposicao_conferir;      -- 0 = nada pra olho humano
#
# O log completo do processo (stdout, com uma linha `AUDIT {...}` em JSON por
# evento) e os screenshots sobem como artifact SEMPRE, inclusive quando falha —
# é o que permite auditar depois sem depender da tela do Actions expirar.

on:
  schedule:
    # 08h00 UTC = 05h00 BRT (Brasil não tem horário de verão desde 2019, então o
    # offset é fixo e a hora não anda sozinha ao longo do ano).
    # ⚠️ O Actions atrasa schedule sob carga (minutos, às vezes mais). Não importa
    # aqui: a fila é do dia inteiro e a trava é por DIA BRT, não por horário.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer nesta rodada"
        required: true
        default: "dry-run"
        type: choice
        options:
          - mapear         # abre a tela do 1º da fila e confere o mapeamento. Nunca escreve.
          - dry-run        # percorre a fila e diz o que faria. Nunca escreve.
          - aplicar        # ESCREVE no Mercos de verdade — teto (liberações) E disponível (recibos)
          - testar-aviso   # só manda o e-mail de aviso de falha e sai. Não abre navegador, não lê a fila.
          - varredura      # SÓ LÊ o limite dos clientes e grava no espelho da Torre. Nunca escreve no Mercos.
          - liberacoes     # SÓ o teto: escreve as liberações assinadas e desfaz as vencidas
          - liberacoes-dry # SÓ o teto, em ensaio: diz o que escreveria. Nunca escreve.
      limite:
        description: "Quantos pagamentos processar (teto de segurança)"
        required: false
        default: "20"
      cnpj:
        description: "Um CNPJ específico — ignora o limite"
        required: false
        default: ""
      # ── É por aqui que a TELA da Torre manda a seleção (peça 1 de 5, 21/ago/2026) ──
      # A aba "Ajuste de Crédito" lista a fila, a pessoa marca quem autoriza, e o
      # endpoint `POST /api/dashboard/inadimplencia/credito/fila/rodar` dispara este
      # workflow com os CNPJs marcados aqui. Ninguém precisa abrir o GitHub.
      # ⚠️ Seleção explícita IGNORA o `limite` de propósito: cortar em 20 uma lista
      # de 30 aprovada por gente escreveria em 20 e calaria sobre 10.
      cnpjs:
        description: "Vários CNPJs separados por vírgula — repõe TODOS os boletos pendentes deles; ignora o limite"
        required: false
        default: ""
      # ⚠️ É ESTE que a tela usa, e a razão é um defeito real (21/ago/2026): filtrar
      # por CNPJ repõe todos os pagamentos pendentes do cliente, inclusive os que
      # alguém já repôs na mão (que continuam na fila, porque nada os baixa) — e o
      # robô soma um delta, então o valor voltaria duas vezes. Por boleto, o que foi
      # marcado é exatamente o que é reposto. Ganha de `cnpjs`/`cnpj`.
      boletos:
        description: "id_boleto separados por vírgula — a seleção EXATA da tela (ganha de cnpjs/cnpj)"
        required: false
        default: ""
      # ⚠️ Só vale para o TETO (`liberacoes`/`liberacoes-dry`), e ignora o `limite`
      # pela mesma razão de `boletos`: cortar em N uma lista escolhida por gente
      # escreveria em parte dela e calaria sobre o resto.
      liberacao:
        description: "id(s) de credito_liberacao separados por vírgula — só para o teto; ignora o limite"
        required: false
        default: ""
      # ⚠️ Quanto esperar antes de REENTRAR no Mercos quando a sessão cai, em segundos.
      # O padrão do robô é 900 (15 min), e o motivo está no `repositor.py`: reentrar na hora
      # rouba a sessão de volta de quem acabou de entrar, essa pessoa loga de novo, derruba o
      # robô, e os dois perdem a tarde.
      # O DESPACHO da Análise de Crédito manda 45 (decisão do usuário, 17/set/2026), e a troca é
      # deliberada: ali a fila é curta (quase sempre 1 cliente), o robô segura a sessão por
      # segundos e alguém está esperando o crédito subir agora. O risco acima CONTINUA existindo
      # — é uma escolha, não um descuido.
      espera_sessao_s:
        description: "Segundos antes de reentrar quando a sessão cai (padrão do robô: 900)"
        required: false
        default: ""
      # Só para o log/auditoria saber que veio de um despacho, e de quem. `github.actor` num
      # dispatch pela API é o dono do token, não a pessoa que decidiu.
      disparado_por:
        description: "Quem originou o disparo (e-mail) — só auditoria"
        required: false
        default: ""

# Duas rodadas ao mesmo tempo somariam o mesmo pagamento duas vezes (o robô soma
# um delta) e disputariam a única sessão que o Mercos permite por usuário.
concurrency:
  group: credito-limite-mercos
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    # ⚠️ O CRON SÓ VALE NO REPO CANÔNICO. `schedule` dispara em TODO espelho do
    # rodízio que tenha este arquivo, e o `concurrency` do Actions é POR
    # REPOSITÓRIO — não serializa entre contas. Medido em 26/ago/2026: o espelho
    # `italo-mgl/torre_etl` rodava os dois crons de crédito, e as varreduras de lá
    # derrubavam a sessão das daqui (o Mercos aceita 1 sessão por usuário, e mesmo
    # a varredura, que só LÊ, ocupa essa sessão). A trava do banco protege o
    # dinheiro, não a sessão — daí esta guarda.
    #
    # ⚠️ SÓ BARRA O `schedule`. `workflow_dispatch` continua valendo em qualquer
    # repo: rodada manual é decisão de uma pessoa, que sabe o que está fazendo.
    #
    # ⚠️ A GUARDA É POR VARIÁVEL, NÃO PELO NOME DO REPO (28/ago/2026). Até aqui ela
    # dizia `github.repository == <repo canonico>`, o que amarrava o robô a UMA
    # conta — e o ETL da Torre roda em RODÍZIO de 3 espelhos, porque a cota grátis
    # de Actions esgota em ~19 dias. Na virada de 27/ago isso apareceu: mover o ETL
    # para `italo-mgl` deixaria o crédito preso na conta que estava saindo, e
    # sincronizar o arquivo para lá faria o `schedule` ser PULADO nos dois lugares —
    # robô parado sem erro em lugar nenhum. Com a variável, virar o rodízio é
    # `gh variable set RODIZIO_ATIVO -b true -R <espelho novo>` + `delete` no antigo.
    #
    # ⚠️ FALHA FECHANDO, de propósito: espelho SEM a variável não roda no schedule.
    # Isso é o oposto do desenho antigo, em que espelho que não tivesse sincronizado
    # o arquivo rodava SOLTO — foi assim que o cron de `italo-mgl` disparou em
    # 25-27/ago e roubou a sessão do Mercos (que aceita 1 sessão por usuário).
    # O preço é que esquecer de setar a variável PARA o robô: o detector disso é a
    # pílula da Gestão de Crédito, que fica vermelha quando não há rodada há 36h.
    #
    # `workflow_dispatch` continua livre em qualquer espelho: rodada manual é decisão
    # de uma pessoa, que sabe o que está fazendo.
    if: github.event_name != 'schedule' || vars.MERCOS_ATIVO == 'true'
    # ⚠️ 60 min, e o número existe por causa da ESPERA DE 15 MIN de `ESPERA_VOLTA_S`
    # (repositor.py): quando a sessão do Mercos cai, o robô dorme 15 min antes de
    # entrar de novo, e pode fazer isso 2x. Com os 30 min de antes, o Actions
    # matava o job DORMINDO — sem rodada fechada, sem e-mail, sem log final: a
    # queda ficaria muda, que é pior que abortar. `CREDITO_JANELA_MIN` abaixo tem
    # que ser MENOR que isto: é ele que faz o robô desistir da volta que não cabe.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automacoes/credito-limite-mercos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ⚠️ Um lugar só decide `modo` e `limite`, e ele vem ANTES de qualquer ação.
      # No `schedule` os inputs chegam vazios (ver o cabeçalho): o default real do
      # cron é aqui. Duplicar essa decisão no step do Repositor faria o log
      # declarar um modo e o robô rodar outro — que é o pior tipo de divergência,
      # porque a auditoria fica coerente consigo mesma e mentindo.
      - name: Decidir modo e limite desta rodada
        id: plano
        env:
          IN_MODO: ${{ inputs.modo }}
          IN_LIMITE: ${{ inputs.limite }}
          GATILHO: ${{ github.event_name }}
        run: |
          MODO="$IN_MODO"
          LIM="$IN_LIMITE"
          if [ "$GATILHO" = "schedule" ]; then
            # ⚠️ `aplicar`: cron em dry-run não repõe nada e ninguém percebe.
            [ -z "$MODO" ] && MODO="aplicar"
            # 60 = ~2,5x a entrada média medida (24 boletos/dia em 20-22/ago) e
            # ~12 min de rodada no ritmo medido (20 boletos em 246 s), dentro do
            # timeout de 30 min. Cobre também o dia seguinte a uma falha.
            [ -z "$LIM" ] && LIM="60"
          fi
          [ -z "$MODO" ] && MODO="dry-run"
          [ -z "$LIM" ] && LIM="20"
          echo "modo=$MODO"   >> "$GITHUB_OUTPUT"
          echo "limite=$LIM"  >> "$GITHUB_OUTPUT"
          echo "gatilho ......... $GATILHO"
          echo "modo ............ $MODO"
          echo "limite .......... $LIM"

      - name: Declarar a rodada (fica no log, antes de qualquer acao)
        run: |
          echo "modo ............ ${{ steps.plano.outputs.modo }}"
          echo "disparado por ... ${{ github.actor }}"
          echo "commit .......... ${{ github.sha }}"
          echo "branch/ref ...... ${{ github.ref_name }}"
          echo "gatilho ......... ${{ github.event_name }}"
          echo "limite .......... ${{ steps.plano.outputs.limite }}"
          echo "cnpj ............ ${{ inputs.cnpj || '(toda a fila)' }}"
          echo "log desta run ... ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ══════════════════════════════════════════════════════════════════════
      # 1º · O TETO (liberações assinadas na Gestão de Crédito)
      # ══════════════════════════════════════════════════════════════════════
      # ⚠️ ANTES da reposição, de propósito — ver o cabeçalho do arquivo: a
      # reposição limita o disponível ao teto, então repor primeiro grudaria a
      # conta no teto velho.
      #
      # ⚠️ Este step NÃO consome a trava de uma-rodada-de-cron-por-dia (o
      # `cron_dia` só é preenchido no modo `aplicar`, ver `auditoria.py`). É
      # correto: aquela trava existe porque a reposição soma um DELTA e rodar
      # duas vezes devolveria dinheiro duas vezes. O teto é valor ABSOLUTO, e
      # `fn_credito_liberacao_marcar_aplicada` recusa o 2º carimbo — repetir é
      # inócuo. Dar a mesma trava aos dois faria um barrar o outro.
      - name: Teto por liberacao assinada
        if: ${{ !cancelled() && contains(fromJSON('["aplicar","liberacoes","liberacoes-dry"]'), steps.plano.outputs.modo) }}
        env:
          MERCOS_EMAIL: ${{ secrets.MERCOS_EMAIL }}
          MERCOS_SENHA: ${{ secrets.MERCOS_SENHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MERCOS_EMPRESAS: ${{ vars.MERCOS_EMPRESAS }}
          AVISO_PARA: ${{ vars.AVISO_PARA }}
          # ⚠️ `github.actor` num dispatch pela API é o DONO DO TOKEN, não quem decidiu.
          # Quando o disparo vem do despacho da Análise de Crédito, o e-mail do analista chega
          # em `inputs.disparado_por` — sem isso a auditoria diria que quem liberou foi o bot.
          DISPARADO_POR: ${{ inputs.disparado_por || github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # ⚠️ SEMPRE ABAIXO do `timeout-minutes` do job (60). É o prazo que o robô
          # confere antes de dormir 15 min pra reconquistar a sessão: sem folga, ele
          # aborta com log e e-mail em vez de ser morto pelo Actions no meio do sono.
          CREDITO_JANELA_MIN: "55"
          # Vazio = o robô usa o padrão dele (900 s). O despacho manda 45 — ver o comentário do
          # input `espera_sessao_s`, onde está o risco que essa escolha aceita.
          CREDITO_ESPERA_VOLTA_S: ${{ inputs.espera_sessao_s }}
        run: |
          MODO="${{ steps.plano.outputs.modo }}"
          ARGS="--liberacoes"
          # ⚠️ `liberacoes-dry` é o ÚNICO dos três que não escreve. `aplicar` e
          # `liberacoes` escrevem — e o default do cron é `aplicar`.
          if [ "$MODO" != "liberacoes-dry" ]; then ARGS="$ARGS --aplicar"; fi
          if [ -n "${{ inputs.liberacao }}" ]; then
            ARGS="$ARGS --liberacao ${{ inputs.liberacao }}"
          else
            ARGS="$ARGS --limite ${{ steps.plano.outputs.limite }}"
          fi
          mkdir -p logs
          echo "rodando: python repositor.py $ARGS"
          # ⚠️ NOME DE LOG PRÓPRIO (`teto-`), não `execucao-`: os dois steps
          # gravam na mesma pasta e o mesmo nome faria o segundo `tee` apagar o
          # primeiro — o artifact perderia justamente o log da escrita de teto.
          set -o pipefail
          PYTHONUNBUFFERED=1 python repositor.py $ARGS 2>&1 | tee "logs/teto-${{ github.run_id }}-${{ github.run_attempt }}.log"

      # ══════════════════════════════════════════════════════════════════════
      # 2º · O DISPONÍVEL (fila de recibos)
      # ══════════════════════════════════════════════════════════════════════
      # ⚠️ `!cancelled()` e não `always()`: uma falha no teto NÃO pode impedir o
      # crédito de boleto pago de voltar (são pessoas esperando venda destravar),
      # mas cancelamento manual tem que parar tudo. O status do job continua
      # vermelho se o teto falhou — o step seguinte rodar não maquia isso.
      - name: Repositor
        if: ${{ !cancelled() && contains(fromJSON('["mapear","dry-run","aplicar","testar-aviso","varredura"]'), steps.plano.outputs.modo) }}
        env:
          MERCOS_EMAIL: ${{ secrets.MERCOS_EMAIL }}
          MERCOS_SENHA: ${{ secrets.MERCOS_SENHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # ⚠️ service_role obrigatório: as tabelas têm RLS e a chave anon não
          # escreve (ver docs/kaique/06-achados-de-seguranca.md).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Empresas do Mercos a procurar. Vazio cai no default (ES) no código —
          # `vars.X` de variável não cadastrada chega como string vazia.
          MERCOS_EMPRESAS: ${{ vars.MERCOS_EMPRESAS }}
          # ── aviso de falha por e-mail (P3, fechada 21/ago/2026) ──
          # Vazio cai no default do código (kaique.breno@gocase.com). Cadastrar a
          # variável `AVISO_PARA` no repo troca quem recebe SEM mexer em código —
          # aceita vários endereços separados por vírgula.
          # ⚠️ Sem secret novo: o e-mail sai pelo MESMO App Password do Gmail
          # (GMAIL_USER/GMAIL_SENHA) que o robô já usa para ler o código de 2FA.
          AVISO_PARA: ${{ vars.AVISO_PARA }}
          # ── auditoria: A PESSOA e o link do log ──
          DISPARADO_POR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # ⚠️ SEMPRE ABAIXO do `timeout-minutes` do job (60). É o prazo que o robô
          # confere antes de dormir 15 min pra reconquistar a sessão: sem folga, ele
          # aborta com log e e-mail em vez de ser morto pelo Actions no meio do sono.
          CREDITO_JANELA_MIN: "55"
        run: |
          # ⚠️ `MODO`/`LIM` vêm do step `plano`, NUNCA de `inputs` direto: no cron
          # os inputs são vazios (ver o cabeçalho do arquivo).
          MODO="${{ steps.plano.outputs.modo }}"
          LIM="${{ steps.plano.outputs.limite }}"
          ARGS=""
          case "$MODO" in
            mapear)  ARGS="--mapear" ;;
            aplicar) ARGS="--aplicar" ;;
            testar-aviso) ARGS="--testar-aviso" ;;
            varredura) ARGS="--varredura" ;;
          esac
          # `--testar-aviso` sai antes de tudo: não faz sentido colar limite/cnpj nele.
          if [ "$MODO" = "testar-aviso" ]; then
            mkdir -p logs
            PYTHONUNBUFFERED=1 python repositor.py --testar-aviso 2>&1 | tee "logs/execucao-${{ github.run_id }}-${{ github.run_attempt }}.log"
            exit ${PIPESTATUS[0]}
          fi
          # ⚠️ A ordem é a precedência, e ela importa: seleção explícita (o que a
          # tela mandou, ou o CNPJ digitado aqui) NUNCA leva `--limite` junto —
          # cortar uma lista aprovada por gente escreveria em parte dela em silêncio.
          # `cnpjs` e `cnpj` somam no script (ver `selecao` em repositor.py).
          # `if` explícito em vez de `[ -n "x" ] && ARGS=...`. ⚠️ CORREÇÃO de uma
          # afirmação errada que eu mesmo escrevi aqui antes: a forma `&&` NÃO mata
          # o job no meio do script — num `&&`-list o comando que falha é isento do
          # `set -e`. O risco é real só quando essa linha é a ÚLTIMA do script: aí o
          # código de saída dela vira o do step, e o step falha com tudo tendo dado
          # certo. O `if` evita a pegadinha em qualquer posição, e é mais legível.
          if [ -n "${{ inputs.boletos }}" ] || [ -n "${{ inputs.cnpjs }}" ] || [ -n "${{ inputs.cnpj }}" ]; then
            if [ -n "${{ inputs.boletos }}" ]; then ARGS="$ARGS --boletos ${{ inputs.boletos }}"; fi
            if [ -n "${{ inputs.cnpjs }}" ]; then ARGS="$ARGS --cnpjs ${{ inputs.cnpjs }}"; fi
            if [ -n "${{ inputs.cnpj }}" ]; then ARGS="$ARGS --cnpj ${{ inputs.cnpj }}"; fi
          elif [ -n "$LIM" ]; then
            ARGS="$ARGS --limite $LIM"
          fi
          mkdir -p logs
          echo "rodando: python repositor.py $ARGS"
          # `tee` + PYTHONUNBUFFERED: o log completo vira arquivo E aparece na
          # tela. `pipefail` porque sem ele o exit code do tee mascara a falha do
          # robô e a rodada termina verde com o robô morto.
          set -o pipefail
          PYTHONUNBUFFERED=1 python repositor.py $ARGS 2>&1 | tee "logs/execucao-${{ github.run_id }}-${{ github.run_attempt }}.log"

      - name: Resumo na tela do Actions
        if: always()
        run: |
          LOG=$(ls -t logs/execucao-*.log 2>/dev/null | head -1)
          # ⚠️ O log do TETO é outro arquivo (ver o step dele). Sem esta parte, o
          # resumo do Actions mostraria só a reposição e o teto sumiria da tela —
          # dando a impressão de que a rodada não escreveu limite nenhum.
          TETO=$(ls -t logs/teto-*.log 2>/dev/null | head -1)
          {
            echo "## CreditoLimite-Mercos — \`${{ steps.plano.outputs.modo }}\` (${{ github.event_name }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Disparado por | \`${{ github.event_name == 'schedule' && 'cron (ninguém pediu)' || github.actor }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo ""
            if [ -n "$TETO" ]; then
              echo "### Teto (liberações assinadas)"
              echo ""
              echo '```'
              grep -E '^\s*\[[0-9:]+ .*(liberacoes|desfazer|aplicar)\]|^=== liberacoes' "$TETO" | head -30 \
                || echo "(nenhuma liberação processada)"
              echo '```'
              echo ""
              echo '```json'
              grep '^AUDIT ' "$TETO" | grep -E 'teto_aplicado|teto_revertido|conferir_na_mao' | head -20 \
                || echo "(nenhum evento de teto)"
              echo '```'
              echo ""
            fi
            if [ -n "$LOG" ]; then
              echo "### Auditoria"
              echo ""
              echo '```'
              sed -n '/AUDITORIA DESTA RODADA/,$p' "$LOG" | head -20
              echo '```'
              echo ""
              echo "### Eventos (linhas AUDIT do log)"
              echo ""
              echo '```json'
              grep '^AUDIT ' "$LOG" | head -40 || echo "(nenhum evento)"
              echo '```'
            else
              echo "⚠️ Nenhum log foi produzido — o robô morreu antes de escrever."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Sempre, inclusive em falha: é o insumo da auditoria pós-execução, e a tela
      # do Actions expira — o artifact não.